apiVersion: mysql.oracle.com/v2
kind: InnoDBCluster
metadata:
  name: my-mysql-cluster
  namespace: sql-server
spec:
  secretName: my-mysql-secret
  tlsUseSelfSigned: true
  instances: 1
  version: "9.5.0"
  baseServerId: 1000

  # --- MySQL Pod Settings ---
  podSpec:
    nodeSelector:
      kubernetes.io/hostname: workerserver
    containers:
      - name: mysql
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

  # --- Router Pod Settings ---
  router:
    instances: 1
    podSpec:
      nodeSelector:
        kubernetes.io/hostname: workerserver
      containers:
        - name: router
          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "1Gi"
              cpu: "500m"
