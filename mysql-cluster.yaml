apiVersion: mysql.oracle.com/v2
kind: InnoDBCluster
metadata:
  name: my-mysql-cluster
  namespace: sql-server
spec:
  secretName: my-mysql-secret
  tlsUseSelfSigned: true
  instances: 1
  version: "9.5.0" 
  baseServerId: 1000 
  
  # Node selection for MySQL pods
  podSpec:
    nodeSelector:
      kubernetes.io/hostname: workerserver
  
  # Router configuration
  router:
    instances: 1
    # Optional: Also pin router to specific node
    podSpec:
      nodeSelector:
        kubernetes.io/hostname: workerserver
  
  # Resource limits (your current ones are good)
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"